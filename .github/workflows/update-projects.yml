name: Actualizar projects.json

on:
  schedule:
    - cron: '0 8 * * *'   # cada día a las 08:00 UTC
  workflow_dispatch:       # botón manual en la pestaña Actions
  push:
    paths:
      - 'scripts/fetch-projects.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # opcional: habilita repos privados con topic "portfolio"
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --staged --quiet || git commit -m "Actualizar projects.json"
          git push
